<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${bookId == null} ? 'Ajouter un livre - LibraryApp' : 'Modifier un livre - LibraryApp'">
            Ajouter un livre - LibraryApp
        </title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/style.css}" rel="stylesheet">

    </head>

    <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container py-5">
            <!-- En tête de la page -->
            <section class="page-header mb-4">
                <span>
                    Administration
                </span>

                <h1 class="section-title mb-2" th:text="${bookId == null} ? 'Ajouter un livre' : 'Modifier le livre'">
                    Ajouter un livre
                </h1>

                <p class="text-muted mb-0"
                   th:text="${bookId == null}
                            ?   'Ajoutez un nouvel ouvrage au catalogue de la bibliothèque.'
                            :   'Modifiez les informations de cet ouvrage et enregistrez vos changements.'">
                    Ajoutez ou modifiez un livre.
                </p>
            </section>

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="admin-form-card">

                        <!-- Message d'erreur métier -->
                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <span th:text="${errorMessage}">
                                Erreur
                            </span>
                        </div>

                        <form th:action="${bookId == null}
                                        ? @{/admin/books}
                                        : @{/admin/books/edit/{id}(id=${bookId})}"
                              th:object="${bookForm}"
                                method="post">

                            <!-- Titre -->
                            <div class="mb-3">
                                <label for="title" class="form-label">Titre</label>
                                <input type="text" id="title" th:field="*{title}" class="form-control">

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('title')}"
                                     th:errors="*{title}"
                                >
                                    Erreur titre
                                </div>
                            </div>

                            <!-- Auteur -->
                            <div class="mb-3">
                                <label for="author" class="form-label">Auteur</label>
                                <input type="text" id="author" th:field="*{author}" class="form-control">

                                <div class="text-danger small"
                                        th:field="${#fields.hasErrors('author')}"
                                        th:errors="*{author}"
                                >
                                    Erreur auteur
                                </div>
                            </div>

                            <!-- ISBN -->
                            <div class="mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" id="isbn" th:field="*{isbn}" class="form-control">

                                <div class="text-danger small"
                                        th:fields="${#fields.hasErrors('isbn')}"
                                        th:errors="*{isbn}"
                                >
                                    Erreur ISBN
                                </div>
                            </div>

                            <!-- Catégorie -->
                            <div class="mb-3">

                                <label for="category" class="form-label">
                                    Catégorie
                                </label>
                                <select id="category" class="form-select" th:field="*{category}">
                                    <option value="">-- Choisir une catégorie --</option>

                                    <option th:each="category : ${categories}"
                                            th:value="${category}"
                                            th:text="${category.displayName}"
                                    >
                                        Catégorie
                                    </option>

                                </select>

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('category')}"
                                     th:errors="*{category}">
                                    Erreur catégorie
                                </div>

                            </div>

                            <!-- Description -->
                            <div class="mb-3">

                                <label for="description"
                                       class="form-label">
                                    Description
                                </label>
                                <textarea id="description"
                                          th:field="*{description}"
                                          class="form-control"
                                          rows="5"></textarea>

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('description')}"
                                     th:errors="*{description}">
                                    Erreur description
                                </div>

                            </div>

                            <!-- Image -->
                            <div class="mb-3">

                                <label for="imageUrl" class="form-label">
                                    Image
                                </label>

                                <input type="text"
                                       id="imageUrl"
                                       th:field="*{imageUrl}"
                                       class="form-control"
                                       placeholder="/images/books/nom-du-livre.jpg">

                                <div class="form-text">
                                    Exemple : /images/books/perry-mason.jpg
                                </div>

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('imageUrl')}"
                                     th:errors="*{imageUrl}">
                                    Erreur image
                                </div>

                            </div>

                            <!-- Nombre d'exemplaires -->
                            <div class="mb-4">

                                <label for="totalCopies"
                                       class="form-label">
                                    Nombre total d’exemplaires
                                </label>

                                <input type="number"
                                       id="totalCopies" th:field="*{totalCopies}"
                                       class="form-control"
                                       min="1">

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('totalCopies')}"
                                     th:errors="*{totalCopies}">
                                    Erreur total
                                </div>
                            </div>

                            <!-- Aciond -->
                            <div class="d-flex gap-2 flex-wrap">

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="${bookId == null}
                                         ? 'Ajouter le livre'
                                         : 'Enregistrer les modifications'">
                                    Ajouter le livre
                                </button>

                                <a th:href="@{/admin/books}"
                                   class="btn btn-outline-secondary">
                                    Annuler
                                </a>

                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script th:src="@{/js/theme.js}"></script>
    </body>
</html>
