<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un livre - LibraryApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            LibraryApp
        </a>

        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/}">
                Accueil
            </a>

            <a class="btn btn-outline-primary btn-sm" th:href="@{/books}">
                Catalogue
            </a>

            <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-warning btn-sm" th:href="@{/admin/books}">
                Gestion des livres
            </a>

            <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}" class="d-inline">
                <button class="btn btn-outline-danger btn-sm" type="submit">
                    Déconnexion
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h1 class="h3 text-center mb-4"
                        th:text="${bookId == null} ? 'Ajouter un livre' : 'Modifier le livre'"
                    >
                        Ajouter un livre
                    </h1>

                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}">Erreur</span>
                    </div>

                    <form th:action="${bookId == null} ? @{/admin/books} : @{/admin/books/edit/{id}(id=${bookId})}"
                          th:object="${bookForm}"
                          method="post"
                    >

                        <div class="mb-3">
                            <label for="title" class="form-label">Titre</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">
                                Erreur titre
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Auteur</label>
                            <input type="text" id="author" th:field="*{author}" class="form-control">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('author')}"
                                 th:errors="*{author}">
                                Erreur auteur
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" id="isbn" th:field="*{isbn}" class="form-control">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('isbn')}"
                                 th:errors="*{isbn}">
                                Erreur ISBN
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Catégorie</label>
                            <select id="category" th:field="*{category}" class="form-select">
                                <option value="">-- Choisir une catégorie --</option>

                                <option th:each="category : ${categories}"
                                        th:value="${category}"
                                        th:text="${category.displayName}">
                                    Catégorie
                                </option>
                            </select>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}">
                                Erreur catégorie
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="5"></textarea>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">
                                Erreur description
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="imageUrl" class="form-label">Image</label>
                            <input type="text"
                                   id="imageUrl"
                                   th:field="*{imageUrl}"
                                   class="form-control"
                                   placeholder="/images/nom-du-livre.jpg">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('imageUrl')}"
                                 th:errors="*{imageUrl}">
                                Erreur image
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="totalCopies" class="form-label">Nombre total d’exemplaires</label>
                            <input type="number"
                                   id="totalCopies"
                                   th:field="*{totalCopies}"
                                   class="form-control"
                                   min="1">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('totalCopies')}"
                                 th:errors="*{totalCopies}">
                                Erreur total
                            </div>
                        </div>

                        <button type="submit"
                                class="btn btn-primary"
                                th:text="${bookId == null} ? 'Ajouter un livre' : 'Enregistrer les modifications'"
                        >
                            Ajouter le livre
                        </button>

                        <a th:href="@{/admin/books}" class="btn btn-outline-secondary">
                            Annuler
                        </a>

                    </form>

                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
