<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Utilisateurs - Administration - LibraryApp</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

    <body>
        <!-- Navbar commune à LibraryApp -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="container py-5">

            <!-- En-tête de la page -->
            <section class="page-header mb-4">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <h1 class="fw-bold mb-2">
                            Utilisateurs inscrits
                        </h1>

                        <p class="text-muted mb-0">
                            Consultez les comptes enregistrés sur LibraryApp,
                            leur rôle et leur date d'inscription.
                        </p>
                    </div>

                    <a th:href="@{/admin}"
                       class="btn btn-outline-secondary">
                        Retour au dashboard
                    </a>
                </div>
            </section>

            <!-- Nombre d'utilisateurs -->
            <div class="mb-3">
                <span class="badge text-bg-primary fs-6">
                    <span th:text="${#lists.size(users)}">
                        0
                    </span>
                    utilisateur(s)
                </span>
            </div>

            <!-- Tableau des utilisateurs -->
            <section class="table-card">
                <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th scope="col">Nom</th>
                        <th scope="col">Email</th>
                        <th scope="col">Rôle</th>
                        <th scope="col">Date d'inscription</th>
                    </tr>
                    </thead>

                    <tbody>
                        <!-- Liste des utilisateurs -->
                        <tr th:each="user : ${users}">

                            <!-- Nom complet -->
                            <td>
                                <strong
                                        th:text="${user.firstName + ' ' + user.lastName}">
                                    Francis Tabora
                                </strong>
                            </td>

                            <!-- Email -->
                            <td th:text="${user.email}">
                                utilisateur@email.com
                            </td>

                            <!-- Rôle -->
                            <td>
                                <span
                                    class="badge"
                                    th:classappend="${user.role.name() == 'ADMIN'
                                        ? ' text-bg-warning'
                                        : ' text-bg-primary'}"
                                    th:text="${user.role}">
                                    USER
                                </span>
                            </td>

                            <!-- Date de création -->
                            <td
                                th:text="${#temporals.format(
                                            user.createdAt,
                                            'dd/MM/yyyy HH:mm'
                                        )}">
                                24/09/2026 01:30
                            </td>
                        </tr>

                        <!-- Cas où aucun utilisateur n'existe -->
                        <tr th:if="${#lists.isEmpty(users)}">

                            <td colspan="4"
                                class="text-center py-4 text-muted">

                                Aucun utilisateur inscrit.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
        <script th:src="@{/js/theme.js}"></script>
    </body>
</html>
