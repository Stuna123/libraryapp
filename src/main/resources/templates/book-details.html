<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Détail du livre - LibraryApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
          LibraryApp
        </a>

        <div class="d-flex gap-2 align-items-center">
          <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              Déconnexion
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <a th:href="@{/books}" class="btn btn-outline-secondary mb-4">
        Retour au catalogue
      </a>

      <div class="card shadow-sm">
        <div class="card-body">

          <img  th:if="${book.imageUrl != null and !book.imageUrl.isEmpty()}"
                th:src="${book.imageUrl}"
                class="img-fluid rounded mb-4"
                alt="Couverture du livre">

          <h2 class="card-title" th:text="${book.title}">Titre du livre</h2>
          <p class="card-text mb-1">
            <strong>Auteur : </strong>
            <span th:text="${book.author}">Auteur</span>
          </p>

          <p class="card-text mb-1">
            <strong>ISBN : </strong>
            <span th:text="${book.isbn}">ISBN</span>
          </p>

          <p class="card-text mb-1">
            <strong>Catégorie : </strong>
            <span th:text="${book.category.displayName}">Catégorie</span>
          </p>

          <p class="card-text mb-1">
            <strong>Exemplaires disponibles : </strong>
            <span th:text="${book.availableCopies}">0</span>
            /
            <span th:text="${book.totalCopies}">0</span>
          </p>

          <p class="card-text mb-1">
            <strong>Description complète : </strong>
            <span th:text="${book.description}">Description complète du livre</span>
          </p>

          <div class="alert alert-danger" th:if="${errorMessage}">
            <span th:text="${errorMessage}">Erreur</span>
          </div>
          <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn btn-primary">
              Connectez-vous pour emprunter
            </a>
          </div>
          <div sec:authorize="isAuthenticated()" th:if="${book.availableCopies > 0}">
            <form th:action="@{/borrow/books/{id}(id=${book.id})}" method="post">
              <div class="mb-3">
                <label for="numberOfDays" class="form-label">
                  Durée d'emprunt en jours
                </label>

                <input type="number"
                       id="numberOfDays"
                       name="numberOfDays"
                       class="form-control"
                       min="1"
                       max="30"
                       value="14"
                       required>
              </div>

              <button type="submit" class="btn btn-primary">
                Emprunter ce livre
              </button>
            </form>
          </div>
          <div sec:authorize="isAuthenticated()" th:if="${book.availableCopies <= 0}" class="alert alert-warning">
            Aucun exemplaire disponible pour ce livre.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
