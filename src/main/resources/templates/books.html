<!DOCTYPE html>
  <html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Catalogue des livres - LibraryApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-5">
        <h1>Catalogue des livres</h1>
        <p class="text-muted">Découvrez les livres disponibles dans notre bibliothèque</p>
        <div class="mb-4 d-flex flex-wrap gap-2">
            <a th:href="@{/books}" class="btn btn-outline-secondary btn-sm">Tous</a>
            <a  th:each="category : ${categories}"
                th:href="@{/books(category=${category})}"
                th:text="${category}"
                class="btn btn-outline-primary btn-sm"
            >
                Catégories
            </a>
        </div>

        <div th:if="${#lists.isEmpty(books)}" class="alert alert-info">
            Aucun livre disponible pour le moment.
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(books)}">
          <div class="col-md-4" th:each="book : ${books}">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                  <h5 class="card-title" th:text="${book.title}">Titre du livre</h5>
                  <p class="card-text mb-1">
                      <strong>Auteur : </strong>
                      <span th:text="${book.author}">Auteur</span>
                  </p>

                  <p class="card-text mb-1">
                      <strong>Catégorie : </strong>
                      <span th:text="${book.category}">Catégorie</span>
                  </p>

                  <p class="card-text mb-1">
                      <strong>Disponibles : </strong>
                      <span th:text="${book.availableCopies}">0</span>
                      /
                      <span th:text="${book.totalCopies}">0</span>
                  </p>

                  <p class="card-text text-muted" th:text="${book.description}">
                      Description du livre
                  </p>

                  <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-primary btn-sm">
                      Voir le détail
                  </a>
              </div>
            </div>
          </div>
        </div>
    </div>
  </body>
</html>
