<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erreur serveur - LibraryApp</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>

    <body>
        <nav class="navbar navbar-expand-lg bg-light border-bottom">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">
                    LibraryApp
                </a>

                <div class="d-flex gap-2 align-items-center">
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/}">
                        Accueil
                    </a>

                    <a class="btn btn-outline-primary btn-sm" th:href="@{/books}">
                        Catalogue
                    </a>

                    <button id="themeToggle" type="button" class="btn btn-outline-dark btn-sm">
                        Mode sombre
                    </button>

                </div>
            </div>
        </nav>
        <div class="container py-5 text-center">
            <h1 class="display-4 fw-bold">500</h1>

            <p class="lead text-muted">
                Une erreur inattendue est survenue. Veuillez réessayer plus tard.
            </p>

            <a th:href="@{/}" class="btn btn-primary">
                Retour à l'accueil
            </a>

            <a th:href="@{/books}" class="btn btn-outline-secondary">
                Voir le catalogue
            </a>
        </div>

        <script th:src="@{/js/theme.js}"></script>
    </body>
</html>
