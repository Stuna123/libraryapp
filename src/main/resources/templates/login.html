<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Connexion - LibraryApp</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h1 class="h3 text-center mb-4">Connexion</h1>
                            <div th:if="${param.registered}" class="alert alert-success">
                                Votre compte a été créé avec succès. Vous pouvez maintenant vous connecter.
                            </div>
                            <div th:if="${param.error}" class="alert alert-danger">
                                Email ou mot de passe incorrect.
                            </div>
                            <div class="alert alert-info" th:if="${param.logout}">
                                Vous avez été déconnecté avec succès.
                            </div>

                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Mot de passe</label>
                                    <input type="password" id="password" name="password" class="form-control" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    Se connecter
                                </button>
                                <p class="text-center mt-3 mb-0">
                                    Pas encore de compte ?
                                    <a th:href="@{/register}">Créer un compte</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
