<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription - LibraryApp</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>

    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card auth-card">
                        <div class="card-body">

                            <div class="auth-header">
                                <h1 class="h3">Créer un compte</h1>
                                <p>Créez votre espace lecteur pour emprunter et suivre vos livres.</p>
                            </div>

                            <form th:action="@{/register}" th:object="${registerForm}" method="post">

                                <div class="mb-3">
                                    <label for="firstName" class="form-label">Prénom</label>
                                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control">

                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('firstName')}"
                                         th:errors="*{firstName}">
                                        Erreur prénom
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Nom</label>
                                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control">

                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('lastName')}"
                                         th:errors="*{lastName}">
                                        Erreur nom
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control">

                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                        Erreur email
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Mot de passe</label>
                                    <input type="password" id="password" th:field="*{password}" class="form-control">

                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}">
                                        Erreur mot de passe
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    Créer mon compte
                                </button>

                                <p class="text-center mt-3 mb-0">
                                    Déjà un compte ?
                                    <a th:href="@{/login}">Se connecter</a>
                                </p>

                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
        <script th:src="@{/js/theme.js}"></script>
    </body>
</html>
